description: "Neuropixels datasets recorded in non-human primates (Macaca nemestrina)
  by Ramanujan T. Raghavan in the Movshov laboratory at New York University. These
  high-density extracellular recordings were studied in Supplementary Fig. 3 of Windolf
  et al., 'DREDge: robust motion correction for high-density extracellular recordings
  across species' (Nature Methods). The data consist of raw Neuropixels electrical
  series and electrode group recordings, captured using multi-electrode extracellular
  electrophysiology."
